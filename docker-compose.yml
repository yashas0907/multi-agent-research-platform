services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Defaults inside the container; override in .env for real providers.
      DATABASE_URL: sqlite+aiosqlite:////data/research_platform.db
      UPLOAD_DIR: /data/uploads
      VECTOR_STORE_DIR: /data/vector_store
    volumes:
      - platform-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: http://localhost:8000
    restart: unless-stopped

volumes:
  platform-data:
