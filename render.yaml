# Render.com free-tier deployment for the backend.
# Deploy: push this repo, then on render.com: New → Blueprint → select this repo.
# Render reads this file and provisions the service automatically.
#
# Set the secret GROQ_API_KEY in the Render dashboard (Environment tab) —
# never in this file. After the first deploy, set CORS_ORIGINS to your
# frontend's live URL (Vercel).

services:
  - type: web
    name: research-platform-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_FORMAT
        value: json
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_FALLBACK_MODELS
        value: qwen/qwen3.8-27b,groq/compound-mini
      - key: LLM_MIN_INTERVAL_SECONDS
        value: "8"
      - key: LLM_REASONING_EFFORT
        value: low
      - key: EMBEDDING_PROVIDER
        value: mock
      - key: WEB_SEARCH_PROVIDER
        value: duckduckgo
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////tmp/research_platform.db
      # --- SET THESE IN THE DASHBOARD (secrets / per-deploy values) ---
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
    # Free-tier note: the service sleeps after ~15 min idle; first request
    # after sleep has a ~50s cold start. Paid plans remove this.
